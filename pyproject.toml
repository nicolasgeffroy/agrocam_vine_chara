[project]
name = "agrocam-agro-chara"
maintainers = [
  {name = "Nicolas Geffroy", email = "nico.geffroy.pro@gmail.com"}
]
license = "MIT"
version = "0.1.0"
description = "Pipeline to extract agronomic characteristics of vineyard images and predicting them for a 15 day period."
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "pillow==12.0.0",
    "requests==2.32.5",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "tqdm==4.67.1",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "scikit-learn==1.7.2",
    "tensorboard==2.20.0",
    "matplotlib==3.10.7",
]

[tool.setuptools.packages.find]
exclude = ['Model', 'Images', 'Results']